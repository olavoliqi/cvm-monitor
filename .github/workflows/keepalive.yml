name: Keepalive (anti-inatividade)

# O GitHub desativa workflows agendados (cron) de repositório público após
# 60 dias sem commit. Este workflow roda nos dias 1 e 15 e, se o último
# commit tiver mais de 30 dias, faz um commit vazio com o GITHUB_TOKEN,
# zerando o contador para todos os workflows. Sem action de terceiro.

on:
  schedule:
    - cron: '0 3 1,15 * *'   # 03:00 UTC nos dias 1 e 15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit vazio se o último commit tiver mais de 30 dias
        run: |
          ultimo=$(git log -1 --format=%ct)
          agora=$(date +%s)
          dias=$(( (agora - ultimo) / 86400 ))
          echo "Último commit há $dias dias."
          if [ "$dias" -lt 30 ]; then
            echo "Nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: mantém os crons ativos (último commit há $dias dias)"
          git push
          echo "Commit vazio enviado."
